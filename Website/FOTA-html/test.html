            function fetchDataFromFirebase() {
                var carListRef = database.ref('CAR_LIST');
                var promises = [];
                
                carListRef.once('value')
                    .then(snapshot => {
                        snapshot.forEach(childSnapshot => {
                            var Vehicle_Name = childSnapshot.key; // Get the key of the child
                            var childData = childSnapshot.val();
                            var Vehicle_State = childData.Vehicle_State;
                            //var NewFeatures = childData.NewFeatures;

                            // Push promises for fetching Last_Login and Current_SWVersion
                            promises.push(
                                readDataFromRTDB("CAR_LIST/" + Vehicle_Name + "/MobileApp/LastLogin")
                                    .then(Last_Login => {
                                        // console.log(Last_Login);
                                        return Last_Login;
                                    })
                                    .catch(error => {
                                        console.error("Error fetching Last_Login: ", error);
                                        throw error; // Rethrow the error to propagate it further
                                    }),
                                readDataFromRTDB("CAR_LIST/" + Vehicle_Name + "/MobileApp/CurrentVersion")
                                    .then(Current_SWVersion => {
                                        // console.log(Current_SWVersion);
                                        return Current_SWVersion;
                                    })
                                    .catch(error => {
                                        console.error("Error fetching Current_SWVersion:", error);
                                        throw error; // Rethrow the error to propagate it further
                                    })
                            );
                            
                            // Add the Vehicle_Name, Vehicle_State, Last_Login, and Current_SWVersion to promises
                            promises.push(
                                Promise.resolve(Vehicle_Name),
                                Promise.resolve(Vehicle_State),
                                //Promise.resolve(NewFeatures)
                            );
                        });
                        
                        // Wait for all promises to resolve
                        return Promise.all(promises);
                    })
                    .then(results => {
                        // Extract Vehicle_Name, Vehicle_State, Last_Login, and Current_SWVersion from results array
                        for (let i = 0; i < results.length; i += 4) {
                            var Last_Login = results[i];
                            var Current_SWVersion = results[i + 1];
                            var Vehicle_Name = results[i + 2];
                            var Vehicle_State = results[i + 3];
                            //var NewFeatures = results[i + 4];
                            
                            // Call addRow with Vehicle_Name, Vehicle_State, Last_Login, and Current_SWVersion
                            addRow(Vehicle_Name, Vehicle_State, Current_SWVersion, Last_Login);
                        }
                    })
                    .catch(error => {
                        console.error("Error fetching car list:", error);
                    });
            }

            function deleteRow(button) {

                    var row = button.parentNode.parentNode;

                    row.parentNode.removeChild(row);
    
                    // Assume you have initialized Firebase and obtained a reference to your database
                    var database = firebase.database();
    
                    // Get a reference to the node you want to delete
                    var nodeRef = database.ref('CAR_LIST/'+entityName);
    
                    // Remove the node
                    nodeRef.remove()
                    .then(function() {
                        console.log("Node removed successfully.");
                        Remove_Files_Directory(entityName);
                    })
                    .catch(function(error) {
                        console.error("Error removing node:", error);
                    });
                }
            }

            function Remove_Files_Directory(entityName) {
                var storageRef = firebase.storage().ref();

                // Assuming entityName is the name of the directory
                var directoryRef = storageRef.child(entityName);

                directoryRef.listAll()
                .then(function(result) {
                    result.items.forEach(function(itemRef) {
                        // Delete the file
                        itemRef.delete()
                        .then(function() {
                            // File deleted successfully
                            console.log("File deleted successfully.");
                        })
                        .catch(function(error) {
                            // Uh-oh, an error occurred!
                            console.error("Error deleting file:", error);
                        });
                    });

                    // After deleting all files, delete the directory itself
                    directoryRef.delete()
                    .then(function() {
                        // Directory deleted successfully
                        console.log("Directory deleted successfully.");
                    })
                    .catch(function(error) {
                        // Uh-oh, an error occurred!
                        console.error("Error deleting directory:", error);
                    });
                })
                .catch(function(error) {
                    // Uh-oh, an error occurred!
                    console.error("Error listing items in directory:", error);
                });
            }

            /* Function to get the current date and time */
            function getCurrentDateTime() {
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                var hours = now.getHours();
                var minutes = String(now.getMinutes()).padStart(2, '0');
                var ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // Handle midnight
                var formattedTime = hours + ':' + minutes + ' ' + ampm;
                return year + '-' + month + '-' + day + ' ' + formattedTime;
            }
